<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
  {% include head.html %}

  <body class="{{ page.body_class | escape }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'en' %}Skip to content{% else %}Saltar al contenido{% endif %}</a>
    {% include sidebar.html %}

    <div class="content-wrapper">
      <main class="content-wrapper__inner" id="main-content" tabindex="-1">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
  </body>
</html>
